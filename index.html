<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pingvinlar Boshqotirmasi - Bubble Sort O'yini</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <!-- Confetti effects for victory -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --arctic-sky-top: #0e1e38;
            --arctic-sky-mid: #254a78;
            --arctic-sky-bottom: #7ca8d4;
            --ice-surface: #e9f7fe;
            --ice-side: #7db1d3;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, var(--arctic-sky-top) 0%, var(--arctic-sky-mid) 40%, var(--arctic-sky-bottom) 85%, #b9dcf2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-bubble {
            font-family: 'Fredoka One', cursive, sans-serif;
        }

        /* Ambient falling snowflakes */
        .snow-particle {
            position: fixed;
            top: -12px;
            color: #ffffff;
            pointer-events: none;
            z-index: 5;
            animation: snowfall linear infinite;
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-10px) translateX(0) rotate(0deg);
                opacity: 0.95;
            }
            100% {
                transform: translateY(105vh) translateX(45px) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Ice stage 3D effect */
        .ice-iceberg {
            background: linear-gradient(180deg, #f0faff 0%, #d8f1fe 40%, #a4d7f5 100%);
            border-bottom: 14px solid #5d98bc;
            box-shadow: 0 25px 45px rgba(8, 28, 56, 0.45), inset 0 3px 8px rgba(255, 255, 255, 0.95);
            border-radius: 36px;
        }

        /* Glassmorphism panels */
        .frosted-glass {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 12px 30px rgba(12, 38, 71, 0.2);
        }

        /* Penguin interaction animations */
        .penguin-slot {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
        }

        /* Selected penguin pointer halo */
        .penguin-slot.is-selected {
            filter: drop-shadow(0 0 16px rgba(250, 204, 21, 0.95));
            transform: translateY(-12px) scale(1.08);
        }

        .penguin-slot.is-neighbor-selected {
            filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.9));
        }

        /* Sakrab o'tish (Jumping swap arc) */
        .jump-right-arc {
            animation: jumpRight 0.55s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
            z-index: 30;
        }

        .jump-left-arc {
            animation: jumpLeft 0.55s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
            z-index: 25;
        }

        @keyframes jumpRight {
            0% { transform: translate(0, 0) rotate(0deg); }
            45% { transform: translate(35px, -65px) rotate(14deg) scale(1.18); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes jumpLeft {
            0% { transform: translate(0, 0) rotate(0deg); }
            45% { transform: translate(-35px, -65px) rotate(-14deg) scale(1.18); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Victory dancing */
        .victory-dance {
            animation: winDance 0.8s infinite alternate ease-in-out;
        }

        @keyframes winDance {
            0% { transform: translateY(0) rotate(-9deg); }
            50% { transform: translateY(-30px) rotate(0deg) scale(1.12); }
            100% { transform: translateY(0) rotate(9deg); }
        }

        /* Cute wing flapping during actions */
        .is-selected .wing-left, .jump-right-arc .wing-left, .victory-dance .wing-left {
            animation: flapL 0.28s infinite alternate ease-in-out;
        }
        .is-selected .wing-right, .jump-right-arc .wing-right, .victory-dance .wing-right {
            animation: flapR 0.28s infinite alternate ease-in-out;
        }
        @keyframes flapL { 0% { transform: rotate(0deg); } 100% { transform: rotate(-38deg); } }
        @keyframes flapR { 0% { transform: rotate(0deg); } 100% { transform: rotate(38deg); } }

        /* Subtle blinking eyes */
        .eye-pupil {
            animation: eyeBlink 4.2s infinite;
            transform-origin: center;
        }
        @keyframes eyeBlink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }
    </style>
</head>

                    <button id="manual-swap-selected-btn" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-400 text-amber-950 font-bold rounded-xl shadow border-b-4 border-amber-700 active:border-b-0 active:translate-y-1 transition text-xs sm:text-sm flex items-center gap-1.5">

    <script>
        // High quality sound effects generator without any external audio files
        class WinterSoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContextClass();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Click / Select chirp
            playSelect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }

            // High bouncy cartoon boing when penguin jumps
            playJumpBoing(pitchMultiplier = 1) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const baseFreq = 340 * pitchMultiplier;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.1, now + 0.16);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.2, now + 0.32);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.005, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }

            // Ice slide / whoosh swap sound
            playSwapSound() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.linearRampToValueAtTime(620, now + 0.12);
                osc.frequency.linearRampToValueAtTime(220, now + 0.3);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.32);
            }

            // Wrong move buzz
            playBuzz() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.setValueAtTime(100, now + 0.1);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }

            // Sorted penguin celebration sound
            playWinFanfare() {
                if (this.muted) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                let time = this.ctx.currentTime;

                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, time);

                    gain.gain.setValueAtTime(0.28, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(time);
                    osc.stop(time + 0.3);
                    time += 0.12;
                });
            }
        }

        const audio = new WinterSoundEffects();

        // Video standard starting array
        const VIDEO_INITIAL_ARRAY = [7, 4, 2, 1, 8, 3, 6, 5];
        let penguins = [...VIDEO_INITIAL_ARRAY];

        // Interaction State
        let selectedIndex = 0; // Currently focused penguin
        let isAutoSorting = false;
        let autoSortTimer = null;
        let isAnimatingSwap = false;
        let movesCount = 0;
        let isGameWon = false;

        // Timer
        let secondsElapsed = 0;
        let gameTimerInterval = null;

        // Colors for scarves corresponding to numbers 1..8
        const scarfPalette = [
            '#ef4444', // 1: Qizil
            '#f97316', // 2: To'q sariq
            '#eab308', // 3: Sariq
            '#10b981', // 4: Yashil
            '#06b6d4', // 5: Zangori
            '#3b82f6', // 6: Ko'k
            '#8b5cf6', // 7: Binafsha
            '#ec4899'  // 8: Pushti
        ];

        function renderPenguinSVG(num) {
            // Height proportional to number 1 to 8: min 110px -> max 220px
            const minH = 115;
            const maxH = 225;
            const height = minH + ((num - 1) / 7) * (maxH - minH);
            const width = height * 0.64;
            const scarf = scarfPalette[(num - 1) % scarfPalette.length];

            return `
            <div class="flex flex-col items-center justify-end select-none pointer-events-none" style="width: ${width}px; height: ${height}px;">
                <svg viewBox="0 0 100 135" class="w-full h-full drop-shadow-md overflow-visible">
                    <!-- Ground shadow -->
                    <ellipse cx="50" cy="128" rx="36" ry="6" fill="#467b9c" opacity="0.4" />

                    <!-- Orange Feet -->
                    <ellipse cx="35" cy="125" rx="14" ry="6" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
                    <ellipse cx="65" cy="125" rx="14" ry="6" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>

                    <!-- Outer Navy Penguin Body -->
                    <path d="M50 10 C25 10 18 36 18 72 C18 104 26 122 50 122 C74 122 82 104 82 72 C82 36 75 10 50 10 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.5"/>

                    <!-- Left Wing -->
                    <path class="wing-left" d="M20 52 C7 62 4 82 12 94 C17 98 22 92 23 78 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.8"/>
                    
                    <!-- Right Wing -->
                    <path class="wing-right" d="M80 52 C93 62 96 82 88 94 C83 98 78 92 77 78 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.8"/>

                    <!-- White Belly -->
                    <path d="M50 36 C34 36 28 56 28 80 C28 104 34 118 50 118 C66 118 72 104 72 80 C72 56 66 36 50 36 Z" fill="#ffffff"/>

                    <!-- Scarf around neck -->
                    <path d="M28 44 Q50 51 72 44 Q74 52 70 56 Q50 60 30 56 Z" fill="${scarf}"/>
                    <path d="M60 50 L68 74 L57 76 L52 52 Z" fill="${scarf}" stroke="#ffffff" stroke-width="0.7"/>

                    <!-- Large Eyes with blinking effect -->
                    <ellipse cx="39" cy="29" rx="6.5" ry="7.5" fill="#ffffff"/>
                    <ellipse class="eye-pupil" cx="40" cy="29" rx="3.5" ry="4" fill="#0f172a"/>
                    <circle cx="38.5" cy="27" r="1.3" fill="#ffffff"/>

                    <ellipse cx="61" cy="29" rx="6.5" ry="7.5" fill="#ffffff"/>
                    <ellipse class="eye-pupil" cx="60" cy="29" rx="3.5" ry="4" fill="#0f172a"/>
                    <circle cx="58.5" cy="27" r="1.3" fill="#ffffff"/>

                    <!-- Cute Rosy Cheeks -->
                    <circle cx="31" cy="37" r="4.5" fill="#fda4af" opacity="0.8"/>
                    <circle cx="69" cy="37" r="4.5" fill="#fda4af" opacity="0.8"/>

                    <!-- Orange Beak -->
                    <polygon points="44,35 56,35 50,46" fill="#ea580c" stroke="#c2410c" stroke-width="1.2"/>

                    <!-- Large readable number written on belly -->
                    <text x="50" y="90" font-family="'Fredoka One', cursive, sans-serif" font-size="34" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">
                        ${num}
                    </text>
                </svg>

                <!-- Value badge pill below feet -->
                <div class="mt-1 font-bubble text-xs sm:text-sm font-bold text-slate-800 bg-white/95 border-2 border-slate-300 px-2.5 py-0.5 rounded-full shadow-sm">
                    ${num}
                </div>
            </div>
            `;
        }

        const track = document.getElementById('penguins-track');
        const swapButtonsRow = document.getElementById('swap-buttons-row');
        const movesLabel = document.getElementById('moves-label');
        const timerLabel = document.getElementById('timer-label');
        const narratorText = document.getElementById('narrator-text');
        const badgeStatus = document.getElementById('badge-status');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const autoPlayBtn = document.getElementById('auto-play-btn');
        const autoIcon = document.getElementById('auto-icon');
        const autoLabel = document.getElementById('auto-label');
        const autoStepBtn = document.getElementById('auto-step-btn');
        const jumpPrevBtn = document.getElementById('jump-prev-btn');
        const jumpNextBtn = document.getElementById('jump-next-btn');
        const manualSwapSelectedBtn = document.getElementById('manual-swap-selected-btn');
        const resetVideoBtn = document.getElementById('reset-video-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const pythonHint = document.getElementById('python-hint');

        // Check if sorted 1..8
        function checkIfSorted() {
            for (let k = 0; k < penguins.length - 1; k++) {
                if (penguins[k] > penguins[k + 1]) return false;
            }
            return true;
        }

        // Timer management
        function startTimer() {
            if (gameTimerInterval) return;
            gameTimerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerLabel.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(gameTimerInterval);
            gameTimerInterval = null;
        }

        function resetTimer() {
            stopTimer();
            secondsElapsed = 0;
            timerLabel.textContent = "00:00";
        }

        function updateStage() {
            track.innerHTML = '';
            swapButtonsRow.innerHTML = '';

            penguins.forEach((val, idx) => {
                // Penguin slot
                const slot = document.createElement('div');
                slot.className = 'penguin-slot cursor-pointer flex flex-col items-center justify-end relative';
                slot.dataset.index = idx;

                if (idx === selectedIndex) {
                    slot.classList.add('is-selected');
                } else if (idx === selectedIndex + 1) {
                    slot.classList.add('is-neighbor-selected');
                }

                if (isGameWon) {
                    slot.classList.add('victory-dance');
                }

                slot.innerHTML = renderPenguinSVG(val);

                // Slot click to select or direct swap
                slot.addEventListener('click', () => {
                    if (isAnimatingSwap || isAutoSorting) return;
                    startTimer();

                    if (selectedIndex === idx && idx < penguins.length - 1) {
                        // Clicking already selected penguin jumps it with its right neighbor!
                        swapPenguins(idx, idx + 1);
                    } else {
                        selectedIndex = idx;
                        audio.playSelect();
                        narratorText.textContent = `Pingvin #${penguins[idx]} tanlandi! O'ngga/chapga sakratish uchun tugmalarni bosing.`;
                        updateStage();
                    }
                });

                track.appendChild(slot);

                // Generate adjacent swap bridge button (between idx and idx+1)
                if (idx < penguins.length - 1) {
                    const swapBtn = document.createElement('button');
                    const isFocusPair = (idx === selectedIndex);
                    swapBtn.className = `px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center justify-center gap-1 active:scale-90 ${
                        isFocusPair 
                        ? 'bg-amber-400 text-amber-950 ring-2 ring-amber-500 scale-105' 
                        : 'bg-white/80 hover:bg-white text-slate-700 border border-slate-300'
                    }`;
                    swapBtn.innerHTML = `<span>⇄</span>`;
                    swapBtn.title = `${penguins[idx]} va ${penguins[idx+1]} o'rnini almashtirish`;
                    
                    swapBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (isAnimatingSwap || isAutoSorting) return;
                        startTimer();
                        selectedIndex = idx;
                        swapPenguins(idx, idx + 1);
                    });

                    swapButtonsRow.appendChild(swapBtn);
                }
            });

            movesLabel.textContent = movesCount;
        }

        function swapPenguins(idxA, idxB) {
            if (isAnimatingSwap) return;
            if (idxA < 0 || idxB < 0 || idxA >= penguins.length || idxB >= penguins.length) return;

            isAnimatingSwap = true;
            movesCount++;
            movesLabel.textContent = movesCount;

            const slots = track.children;
            const slotA = slots[idxA];
            const slotB = slots[idxB];

            // Sound: High boing jump
            audio.playJumpBoing(1 + (penguins[idxA] * 0.08));

            // Visual Jump classes
            if (idxA < idxB) {
                slotA.classList.add('jump-right-arc');
                slotB.classList.add('jump-left-arc');
            } else {
                slotA.classList.add('jump-left-arc');
                slotB.classList.add('jump-right-arc');
            }

            narratorText.textContent = `🦘 #${penguins[idxA]} va #${penguins[idxB]} sakrab joylarini almashtirmoqda!`;
            badgeStatus.textContent = "Sakramoqda...";
            badgeStatus.className = "shrink-0 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300";

            setTimeout(() => {
                // Actual array swap
                const temp = penguins[idxA];
                penguins[idxA] = penguins[idxB];
                penguins[idxB] = temp;

                audio.playSwapSound();

                slotA.classList.remove('jump-right-arc', 'jump-left-arc');
                slotB.classList.remove('jump-right-arc', 'jump-left-arc');

                isAnimatingSwap = false;

                // Check victory condition
                if (checkIfSorted()) {
                    handleVictory();
                } else {
                    badgeStatus.textContent = "Davom eting";
                    badgeStatus.className = "shrink-0 px-2.5 py-1 rounded-full text-xs font-bold bg-cyan-100 text-cyan-800 border border-cyan-300";
                    updateStage();
                }
            }, 550);
        }

        function handleVictory() {
            isGameWon = true;
            stopAutoPlay();
            stopTimer();

            narratorText.textContent = `🎉 QOYILMAQOM! Barcha 8 ta pingvin tartib bilan (1..8) to'g'ri tizildi!`;
            badgeStatus.textContent = "G'alaba!";
            badgeStatus.className = "shrink-0 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-400";
            pythonHint.textContent = "✅ Saralash yakunlandi: [1, 2, 3, 4, 5, 6, 7, 8]";

            audio.playWinFanfare();
            updateStage();

            // Festive confetti blast
            if (window.confetti) {
                confetti({
                    particleCount: 90,
                    spread: 80,
                    origin: { y: 0.6 }
                });
                setTimeout(() => {
                    confetti({ particleCount: 70, angle: 60, spread: 55, origin: { x: 0 } });
                    confetti({ particleCount: 70, angle: 120, spread: 55, origin: { x: 1 } });
                }, 300);
            }
        }

        function performBubbleSortSingleStep() {
            if (isAnimatingSwap || isGameWon) return;

            startTimer();

            // Find first unsorted adjacent inversion: arr[j] > arr[j+1]
            let foundSwap = false;
            for (let j = 0; j < penguins.length - 1; j++) {
                if (penguins[j] > penguins[j + 1]) {
                    selectedIndex = j;
                    pythonHint.textContent = `if arr[${j}] (${penguins[j]}) > arr[${j+1}] (${penguins[j+1]}): swap!`;
                    swapPenguins(j, j + 1);
                    foundSwap = true;
                    break;
                }
            }

            if (!foundSwap && checkIfSorted()) {
                handleVictory();
            }
        }

        // Automatic Bubble Sort Engine (Computer solves it)
        function toggleAutoPlay() {
            if (isAutoSorting) {
                stopAutoPlay();
            } else {
                if (isGameWon) {
                    resetToVideoState();
                }
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            isAutoSorting = true;
            autoPlayBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
            autoPlayBtn.classList.add('bg-rose-600', 'hover:bg-rose-500');
            autoIcon.textContent = "⏸";
            autoLabel.textContent = "To'xtatish";
            badgeStatus.textContent = "Kompyuter saralamoqda";
            startTimer();

            autoSortTimer = setInterval(() => {
                if (checkIfSorted()) {
                    stopAutoPlay();
                    handleVictory();
                    return;
                }
                if (!isAnimatingSwap) {
                    performBubbleSortSingleStep();
                }
            }, 750);
        }

        function stopAutoPlay() {
            isAutoSorting = false;
            clearInterval(autoSortTimer);
            autoSortTimer = null;
            autoPlayBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500');
            autoPlayBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
            autoIcon.textContent = "▶";
            autoLabel.textContent = "Kompyuter Saralashi";
            if (!isGameWon) {
                badgeStatus.textContent = "Kutilmoqda";
            }
        }

        function resetToVideoState() {
            stopAutoPlay();
            resetTimer();
            isGameWon = false;
            movesCount = 0;
            selectedIndex = 0;
            penguins = [...VIDEO_INITIAL_ARRAY];
            narratorText.textContent = "Videodagi dastlabki tartib qaytarildi: [7, 4, 2, 1, 8, 3, 6, 5]";
            badgeStatus.textContent = "Tiklandi";
            pythonHint.textContent = "v = [7, 4, 2, 1, 8, 3, 6, 5]";
            audio.playSelect();
            updateStage();
        }

        function shuffleArray() {
            stopAutoPlay();
            resetTimer();
            isGameWon = false;
            movesCount = 0;
            selectedIndex = 0;

            // Fisher-Yates shuffle
            do {
                for (let k = penguins.length - 1; k > 0; k--) {
                    const r = Math.floor(Math.random() * (k + 1));
                    [penguins[k], penguins[r]] = [penguins[r], penguins[k]];
                }
            } while (checkIfSorted());

            narratorText.textContent = "Pingvinlar aralashtirildi! Endi ularni tartib bilan terib chiqing.";
            badgeStatus.textContent = "Aralashtirildi";
            audio.playSwapSound();
            updateStage();
        }

        // Jump Selected Left
        jumpPrevBtn.addEventListener('click', () => {
            if (isAnimatingSwap || isAutoSorting) return;
            startTimer();
            if (selectedIndex > 0) {
                const target = selectedIndex - 1;
                swapPenguins(target, selectedIndex);
                selectedIndex = target;
            } else {
                audio.playBuzz();
                narratorText.textContent = "Eng birinchi pingvin undan chapga o'ta olmaydi!";
            }
        });

        // Jump Selected Right
        jumpNextBtn.addEventListener('click', () => {
            if (isAnimatingSwap || isAutoSorting) return;
            startTimer();
            if (selectedIndex < penguins.length - 1) {
                const target = selectedIndex + 1;
                swapPenguins(selectedIndex, target);
                selectedIndex = target;
            } else {
                audio.playBuzz();
                narratorText.textContent = "Eng oxirgi pingvin undan o'ngga o'ta olmaydi!";
            }
        });

        // Swap selected pair
        manualSwapSelectedBtn.addEventListener('click', () => {
            if (isAnimatingSwap || isAutoSorting) return;
            startTimer();
            if (selectedIndex < penguins.length - 1) {
                swapPenguins(selectedIndex, selectedIndex + 1);
            } else if (selectedIndex > 0) {
                swapPenguins(selectedIndex - 1, selectedIndex);
                selectedIndex--;
            }
        });

        // Single step button
        autoStepBtn.addEventListener('click', () => {
            stopAutoPlay();
            performBubbleSortSingleStep();
        });

        autoPlayBtn.addEventListener('click', toggleAutoPlay);
        resetVideoBtn.addEventListener('click', resetToVideoState);
        shuffleBtn.addEventListener('click', shuffleArray);

        // Sound Mute Toggle
        soundBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            if (audio.muted) {
                soundIcon.textContent = "🔇";
            } else {
                soundIcon.textContent = "🔊";
                audio.playSelect();
            }
        });

        // Ambient falling snowflakes builder
        function generateFallingSnow() {
            const container = document.getElementById('snowfall-wrap');
            const flakeCount = 35;
            for (let i = 0; i < flakeCount; i++) {
                const flake = document.createElement('div');
                flake.className = 'snow-particle';
                flake.textContent = ['❄', '❅', '•', '❆'][Math.floor(Math.random() * 4)];
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.fontSize = (Math.random() * 14 + 10) + 'px';
                flake.style.opacity = Math.random() * 0.7 + 0.3;
                flake.style.animationDuration = (Math.random() * 6 + 5) + 's';
                flake.style.animationDelay = (Math.random() * 7) + 's';
                container.appendChild(flake);
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            generateFallingSnow();
            updateStage();
        });
    </script>
</body>
</html>
