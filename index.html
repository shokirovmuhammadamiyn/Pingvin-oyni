<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Sort Vizualizatsiyasi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #2b3a67, #131b2e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 5px;
      color: #f6c85f;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    p.subtitle {
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    /* Pingvinlar / elementlar maydoni */
    .stage {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      min-height: 260px;
      width: 100%;
      max-width: 760px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }

    .item {
      width: 60px;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 3px solid #64748b;
      border-radius: 35px 35px 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 15px;
      color: #fff;
      font-weight: bold;
      font-size: 1.4rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      position: relative;
    }

    /* Pingvin ko'kragi (oq doira) */
    .item::after {
      content: attr(data-val);
      position: absolute;
      top: 20px;
      width: 38px;
      height: 38px;
      background: #ffffff;
      border-radius: 50%;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Solishtirilayotgan elementlar */
    .item.comparing {
      background: linear-gradient(180deg, #f59e0b, #b45309);
      border-color: #fef08a;
      transform: translateY(-16px) scale(1.05);
      box-shadow: 0 12px 25px rgba(245, 158, 11, 0.5);
    }

    /* O'rni almashayotganlar */
    .item.swapping {
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      border-color: #fca5a5;
      transform: translateY(-20px) scale(1.08);
    }

    /* Saralanib joyiga tushganlar */
    .item.sorted {
      background: linear-gradient(180deg, #10b981, #047857);
      border-color: #6ee7b7;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
    }

    /* Boshqaruv tugmalari */
    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 12px 26px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    button:hover:not(:disabled) {
      background: #2563eb;
      transform: translateY(-2px);
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.6;
    }

    #resetBtn {
      background: #64748b;
      box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3);
    }

    #resetBtn:hover:not(:disabled) {
      background: #475569;
    }

    /* Holat matni */
    .status {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #94a3b8;
      min-height: 28px;
    }
  </style>
</head>
<body>

  <h1>Bubble Sort Animatsiyasi</h1>
  <p class="subtitle">Elementlar qadamma-qadam taqqoslanadi va o‘rni almashtiriladi</p>

  <div class="stage" id="stage"></div>

  <div class="status" id="statusText">Boshlash uchun "Saralashni boshlash" tugmasini bosing</div>

  <div class="controls">
    <button id="startBtn">Saralashni boshlash</button>
    <button id="resetBtn">Qayta tiklash</button>
  </div>

  <script>
    const initialArray = [7, 4, 2, 1, 8, 3, 6, 5];
    let arr = [...initialArray];
    const stage = document.getElementById('stage');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Elementlarni ekranga chizish
    function renderArray(activeIdx1 = -1, activeIdx2 = -1, isSwap = false, sortedIdxs = []) {
      stage.innerHTML = '';
      arr.forEach((val, idx) => {
        const item = document.createElement('div');
        item.classList.add('item');
        item.setAttribute('data-val', val);
        item.style.height = `${val * 24 + 40}px`;

        if (idx === activeIdx1 || idx === activeIdx2) {
          item.classList.add(isSwap ? 'swapping' : 'comparing');
        }

        if (sortedIdxs.includes(idx)) {
          item.classList.add('sorted');
        }

        stage.appendChild(item);
      });
    }

    // Kutish (delay) funksiyasi
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Bubble Sort algoritmi animatsiyasi
    async function bubbleSort() {
      startBtn.disabled = true;
      resetBtn.disabled = true;
      const n = arr.length;
      let sortedIndices = [];

      for (let i = 0; i < n - 1; i++) {
        let swapped = false;

        for (let j = 0; j < n - 1 - i; j++) {
          statusText.textContent = `Taqqoslanmoqda: ${arr[j]} va ${arr[j + 1]}`;
          renderArray(j, j + 1, false, sortedIndices);
          await delay(600);

          if (arr[j] > arr[j + 1]) {
            statusText.textContent = `Almashtirilmoqda: ${arr[j]} > ${arr[j + 1]}`;
            renderArray(j, j + 1, true, sortedIndices);
            await delay(400);

            // Almashinuv
            let temp = arr[j];
            arr[j] = arr[j + 1];
            arr[j + 1] = temp;
            swapped = true;

            renderArray(j, j + 1, false, sortedIndices);
            await delay(500);
          }
        }

        sortedIndices.push(n - 1 - i);
        renderArray(-1, -1, false, sortedIndices);

        // Agar biror marta ham almashinuv bo'lmagan bo'lsa, massiv allaqachon saralangan
        if (!swapped) break;
      }

      // Hamma elementlarni yashil (saralangan) qilish
      sortedIndices = arr.map((_, i) => i);
      renderArray(-1, -1, false, sortedIndices);
      statusText.textContent = "Saralash yakunlandi! Natija: [" + arr.join(', ') + "]";
      resetBtn.disabled = false;
    }

    // Qayta tiklash
    function reset() {
      arr = [...initialArray];
      renderArray();
      statusText.textContent = "Boshlash uchun \"Saralashni boshlash\" tugmasini bosing";
      startBtn.disabled = false;
    }

    startBtn.addEventListener('click', bubbleSort);
    resetBtn.addEventListener('click', reset);

    // Dastlabki holatda ekranga chiqarish
    renderArray();
  </script>
</body>
</html>
