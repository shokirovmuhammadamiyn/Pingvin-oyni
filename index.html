<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Sort Boshqotirmasi - Multik Personajlar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Fredoka', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #294073, #111a33);
      --stage-floor: #e0f2fe;
      --card-bg: rgba(255, 255, 255, 0.12);
      --accent: #f59e0b;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 12px;
      color: #fff;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 1px;
      color: #fcd34d;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 6px;
    }

    p.tagline {
      font-size: 1rem;
      color: #cbd5e1;
    }

    /* Personaj tanlash paneli */
    .theme-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 12px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-wrap: wrap;
      justify-content: center;
    }

    .theme-btn {
      background: transparent;
      border: 2px solid transparent;
      color: #cbd5e1;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .theme-btn.active {
      background: #f59e0b;
      color: #111827;
      border-color: #fde68a;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      transform: scale(1.05);
    }

    /* O'yin maydoni */
    .game-arena {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 380px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Tabiat foni / dekoratsiyalar */
    .scenery {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .scenery-item {
      position: absolute;
      opacity: 0.85;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      transition: all 0.6s ease;
    }

    /* Muzlik / Yer platformasi */
    .stage-platform {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 70px;
      background: var(--stage-floor);
      border-top: 4px solid rgba(255, 255, 255, 0.8);
      border-radius: 0 0 28px 28px;
      box-shadow: inset 0 8px 16px rgba(0,0,0,0.15);
    }

    /* Qahramonlar konteyneri */
    .characters-track {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      height: 280px;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      padding: 0 20px;
    }

    /* Har bir qahramon slot/kartasi */
    .char-node {
      position: absolute;
      bottom: 0;
      width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      transition: left 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s ease;
      transform-origin: bottom center;
    }

    .char-node:hover {
      transform: translateY(-8px) scale(1.05);
    }

    .char-node.selected {
      filter: drop-shadow(0 0 16px #fcd34d);
      transform: translateY(-16px) scale(1.12);
    }

    /* Silliq egri sakrash animatsiyasi */
    .char-node.jumping-left {
      animation: jumpArcLeft 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      z-index: 10;
    }

    .char-node.jumping-right {
      animation: jumpArcRight 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      z-index: 10;
    }

    @keyframes jumpArcLeft {
      0% { transform: translate(0, 0) scale(1); }
      45% { transform: translate(0, -60px) scale(1.18) rotate(-10deg); }
      100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    }

    @keyframes jumpArcRight {
      0% { transform: translate(0, 0) scale(1); }
      45% { transform: translate(0, -60px) scale(1.18) rotate(10deg); }
      100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    }

    /* Qahramon rasmi / SVG shakli */
    .character-body {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .char-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35));
      transition: all 0.3s ease;
    }

    /* Raqam nishoni */
    .badge-number {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: #ffffff;
      color: #111827;
      font-size: 1.25rem;
      font-weight: 900;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(0,0,0,0.15);
      border: 2px solid #fff;
    }

    /* G'alaba qozongandagi raqs */
    .char-node.victory {
      animation: victoryDance 0.7s infinite alternate ease-in-out;
    }

    @keyframes victoryDance {
      0% { transform: translateY(0) rotate(-6deg); }
      100% { transform: translateY(-24px) rotate(6deg); }
    }

    /* Interaktiv tugmalar paneli */
    .control-panel {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 900px;
    }

    .status-box {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f1f5f9;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .buttons-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      color: #fff;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 22px rgba(0,0,0,0.4);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-move { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
    .btn-step { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .btn-auto { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-reset { background: linear-gradient(135deg, #64748b, #475569); }

    /* Konfetti effekti */
    .confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <header>
    <h1>Bubble Sort Boshqotirmasi</h1>
    <p class="tagline">Personajni tanlang, o'zingiz sakratib tartiblang yoki Bubble Sort orqali saralang!</p>
  </header>

  <!-- Personaj tanlash -->
  <div class="theme-selector">
    <button class="theme-btn active" data-theme="penguin">🐧 Pingvinlar</button>
    <button class="theme-btn" data-theme="bear">🐻 Ayiqchalar</button>
    <button class="theme-btn" data-theme="chick">🐥 Jo'jachalar</button>
    <button class="theme-btn" data-theme="fish">🐠 Baliqchalar</button>
  </div>

  <!-- O'yin maydoni -->
  <div class="game-arena" id="arena">
    <div class="scenery" id="scenery"></div>
    <div class="characters-track" id="track"></div>
    <div class="stage-platform"></div>
  </div>

  <!-- Boshqaruv paneli -->
  <div class="control-panel">
    <div class="status-box" id="statusText">
      Qaysidir qahramonni bosing yoki qo'lda almashtiring!
    </div>

    <div class="buttons-group">
      <button class="btn btn-move" id="btnLeft" disabled>⬅️ Chapga sakrash</button>
      <button class="btn btn-move" id="btnRight" disabled>O'ngga sakrash ➡️</button>
      <button class="btn btn-step" id="btnStep">👟 1 Qadam (Bubble)</button>
      <button class="btn btn-auto" id="btnAuto">⚡ Avto Saralash</button>
      <button class="btn btn-reset" id="btnReset">🎲 Aralashtirish</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. WEB AUDIO API - QUFNOQ OVOZ EFFEKTLARI
       ========================================================== */
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // Sakrash (boing/spring) tovushi
      playJump(isRight = true) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;

        osc.type = 'sine';
        const startFreq = isRight ? 260 : 380;
        const endFreq = isRight ? 580 : 220;

        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.35);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      },
      // Xatolik yoki kichik ogohlantirish tovushi
      playClick() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      },
      // G'alaba musiqasi
      playVictory() {
        this.init();
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.55);
          }, idx * 110);
        });
      }
    };

    /* ==========================================================
       2. PERSONAJLARNING SVG MODELLARI VA MAVZULARI
       ========================================================== */
    const THEMES = {
      penguin: {
        bg: 'radial-gradient(circle at 50% 20%, #294073, #111a33)',
        floor: '#e0f2fe',
        card: 'rgba(255, 255, 255, 0.12)',
        sceneryHTML: `
          <div class="scenery-item" style="left: 30px; bottom: 65px; font-size: 70px;">🏔️</div>
          <div class="scenery-item" style="right: 40px; bottom: 65px; font-size: 65px;">⛄</div>
          <div class="scenery-item" style="right: 120px; bottom: 70px; font-size: 55px;">❄️</div>
          <div class="scenery-item" style="left: 120px; bottom: 70px; font-size: 50px;">🌲</div>
        `,
        renderSVG(val, height) {
          return `
            <svg class="char-svg" viewBox="0 0 100 130" style="height: ${height}px;">
              <!-- Qanotlar -->
              <ellipse cx="14" cy="75" rx="9" ry="24" fill="#0f172a" transform="rotate(-15 14 75)"/>
              <ellipse cx="86" cy="75" rx="9" ry="24" fill="#0f172a" transform="rotate(15 86 75)"/>
              <!-- Tana -->
              <path d="M 50 10 C 26 10 18 40 18 85 C 18 115 30 125 50 125 C 70 125 82 115 82 85 C 82 40 74 10 50 10 Z" fill="#0f172a"/>
              <!-- Oq qorin -->
              <ellipse cx="50" cy="75" rx="24" ry="40" fill="#f8fafc"/>
              <!-- Ko'zlar -->
              <circle cx="41" cy="36" r="6" fill="#fff"/>
              <circle cx="43" cy="36" r="2.8" fill="#000"/>
              <circle cx="59" cy="36" r="6" fill="#fff"/>
              <circle cx="57" cy="36" r="2.8" fill="#000"/>
              <!-- Tumshug'i -->
              <polygon points="50,42 43,49 57,49" fill="#f59e0b"/>
              <!-- Oyoqchalar -->
              <ellipse cx="38" cy="126" rx="9" ry="4" fill="#f59e0b"/>
              <ellipse cx="62" cy="126" rx="9" ry="4" fill="#f59e0b"/>
            </svg>
          `;
        }
      },
      bear: {
        bg: 'radial-gradient(circle at 50% 20%, #451a03, #1f0b02)',
        floor: '#854d0e',
        card: 'rgba(255, 255, 255, 0.08)',
        sceneryHTML: `
          <div class="scenery-item" style="left: 40px; bottom: 65px; font-size: 70px;">🌲</div>
          <div class="scenery-item" style="left: 110px; bottom: 65px; font-size: 55px;">🪵</div>
          <div class="scenery-item" style="right: 50px; bottom: 65px; font-size: 65px;">🏕️</div>
          <div class="scenery-item" style="right: 130px; bottom: 65px; font-size: 50px;">🌲</div>
        `,
        renderSVG(val, height) {
          return `
            <svg class="char-svg" viewBox="0 0 100 130" style="height: ${height}px;">
              <!-- Quloqlar -->
              <circle cx="28" cy="24" r="14" fill="#78350f"/>
              <circle cx="28" cy="24" r="7" fill="#fbbf24"/>
              <circle cx="72" cy="24" r="14" fill="#78350f"/>
              <circle cx="72" cy="24" r="7" fill="#fbbf24"/>
              <!-- Qalpoqcha -->
              <polygon points="50,4 34,26 66,26" fill="#dc2626"/>
              <circle cx="50" cy="4" r="5" fill="#fef08a"/>
              <!-- Tana va bosh -->
              <ellipse cx="50" cy="85" rx="34" ry="40" fill="#92400e"/>
              <circle cx="50" cy="45" r="28" fill="#92400e"/>
              <!-- Ko'krak/qorin oq doira -->
              <ellipse cx="50" cy="86" rx="22" ry="28" fill="#fef3c7"/>
              <!-- Tumshuq qismi -->
              <ellipse cx="50" cy="50" rx="14" ry="10" fill="#fef3c7"/>
              <ellipse cx="50" cy="46" rx="5" ry="3.5" fill="#1f2937"/>
              <!-- Ko'zlar -->
              <circle cx="41" cy="38" r="3.5" fill="#111827"/>
              <circle cx="59" cy="38" r="3.5" fill="#111827"/>
              <!-- Panjalar -->
              <circle cx="20" cy="78" r="10" fill="#78350f"/>
              <circle cx="80" cy="78" r="10" fill="#78350f"/>
            </svg>
          `;
        }
      },
      chick: {
        bg: 'radial-gradient(circle at 50% 20%, #1e3a5f, #0c1a2e)',
        floor: '#166534',
        card: 'rgba(255, 255, 255, 0.1)',
        sceneryHTML: `
          <div class="scenery-item" style="left: 30px; bottom: 65px; font-size: 65px;">🌻</div>
          <div class="scenery-item" style="left: 100px; bottom: 65px; font-size: 50px;">🌾</div>
          <div class="scenery-item" style="right: 40px; bottom: 65px; font-size: 65px;">🏡</div>
          <div class="scenery-item" style="right: 120px; bottom: 65px; font-size: 55px;">🌷</div>
        `,
        renderSVG(val, height) {
          return `
            <svg class="char-svg" viewBox="0 0 100 130" style="height: ${height}px;">
              <!-- Qanotlar -->
              <ellipse cx="16" cy="80" rx="8" ry="18" fill="#eab308" transform="rotate(-15 16 80)"/>
              <ellipse cx="84" cy="80" rx="8" ry="18" fill="#eab308" transform="rotate(15 84 80)"/>
              <!-- Tana va Bosh -->
              <circle cx="50" cy="85" r="34" fill="#facc15"/>
              <circle cx="50" cy="42" r="24" fill="#facc15"/>
              <!-- Qorin -->
              <ellipse cx="50" cy="88" rx="22" ry="26" fill="#fef08a"/>
              <!-- Ko'zlar -->
              <circle cx="42" cy="38" r="4.5" fill="#000"/>
              <circle cx="43.5" cy="36.5" r="1.5" fill="#fff"/>
              <circle cx="58" cy="38" r="4.5" fill="#000"/>
              <circle cx="59.5" cy="36.5" r="1.5" fill="#fff"/>
              <!-- Tumshug'i -->
              <polygon points="50,44 43,51 57,51" fill="#ea580c"/>
              <!-- Qizil kokili -->
              <ellipse cx="50" cy="18" rx="5" ry="9" fill="#ef4444"/>
              <!-- Oyoqlar -->
              <ellipse cx="40" cy="124" rx="8" ry="3.5" fill="#ea580c"/>
              <ellipse cx="60" cy="124" rx="8" ry="3.5" fill="#ea580c"/>
            </svg>
          `;
        }
      },
      fish: {
        bg: 'radial-gradient(circle at 50% 20%, #0369a1, #082f49)',
        floor: '#0284c7',
        card: 'rgba(255, 255, 255, 0.1)',
        sceneryHTML: `
          <div class="scenery-item" style="left: 30px; bottom: 65px; font-size: 70px;">🪸</div>
          <div class="scenery-item" style="left: 110px; bottom: 65px; font-size: 55px;">🫧</div>
          <div class="scenery-item" style="right: 40px; bottom: 65px; font-size: 65px;">🐚</div>
          <div class="scenery-item" style="right: 120px; bottom: 65px; font-size: 50px;">🫧</div>
        `,
        renderSVG(val, height) {
          return `
            <svg class="char-svg" viewBox="0 0 100 130" style="height: ${height}px;">
              <!-- Dum suzgichlari -->
              <path d="M 50 115 Q 25 135 15 120 Q 35 105 50 105 Z" fill="#f97316"/>
              <path d="M 50 115 Q 75 135 85 120 Q 65 105 50 105 Z" fill="#f97316"/>
              <!-- Tana (vertikal baliqcha) -->
              <ellipse cx="50" cy="65" rx="33" ry="46" fill="#fb923c"/>
              <!-- Yon suzgichlar -->
              <ellipse cx="14" cy="65" rx="6" ry="18" fill="#ea580c"/>
              <ellipse cx="86" cy="65" rx="6" ry="18" fill="#ea580c"/>
              <!-- Oq qorin markazi -->
              <ellipse cx="50" cy="66" rx="21" ry="30" fill="#ffedd5"/>
              <!-- Ko'zlar -->
              <circle cx="38" cy="38" r="6.5" fill="#fff"/>
              <circle cx="39" cy="38" r="3" fill="#000"/>
              <circle cx="62" cy="38" r="6.5" fill="#fff"/>
              <circle cx="61" cy="38" r="3" fill="#000"/>
              <!-- Og'izcha -->
              <ellipse cx="50" cy="24" rx="6" ry="3.5" fill="#c2410c"/>
            </svg>
          `;
        }
      }
    };

    /* ==========================================================
       3. ASOSIY DASTUR MANTIQI VA HOZIRGI HOLAT
       ========================================================== */
    const INITIAL_ARRAY = [7, 4, 2, 1, 8, 3, 6, 5];
    let array = [...INITIAL_ARRAY];
    let currentTheme = 'penguin';
    let selectedIdx = null;
    let isBusy = false;

    // DOM Elementlar
    const arena = document.getElementById('arena');
    const scenery = document.getElementById('scenery');
    const track = document.getElementById('track');
    const statusText = document.getElementById('statusText');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnStep = document.getElementById('btnStep');
    const btnAuto = document.getElementById('btnAuto');
    const btnReset = document.getElementById('btnReset');
    const themeBtns = document.querySelectorAll('.theme-btn');

    // Mavzuni sozlash
    function applyTheme(themeKey) {
      currentTheme = themeKey;
      const theme = THEMES[themeKey];
      document.body.style.background = theme.bg;
      arena.style.background = theme.card;
      document.querySelector('.stage-platform').style.background = theme.floor;
      scenery.innerHTML = theme.sceneryHTML;

      themeBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === themeKey);
      });
      renderTrack();
    }

    // Element koordinatalarini hisoblash
    function getNodeLeftPosition(index, total) {
      const trackWidth = track.clientWidth || 800;
      const charWidth = 80;
      const padding = 20;
      const usableWidth = trackWidth - (padding * 2) - charWidth;
      const gap = usableWidth / (total - 1);
      return padding + (index * gap);
    }

    // Qahramonlarni ekranga joylash
    function renderTrack() {
      track.innerHTML = '';
      const total = array.length;

      array.forEach((val, idx) => {
        const node = document.createElement('div');
        node.className = 'char-node';
        node.id = `char-${idx}`;
        node.dataset.index = idx;
        node.dataset.value = val;

        // O'lcham (1 dan 8 gacha mos proportsiyada balandlashadi)
        const minHeight = 110;
        const maxHeight = 230;
        const height = minHeight + ((val - 1) / 7) * (maxHeight - minHeight);

        const leftPos = getNodeLeftPosition(idx, total);
        node.style.left = `${leftPos}px`;

        // SVG qahramon
        const charHtml = THEMES[currentTheme].renderSVG(val, height);

        node.innerHTML = `
          <div class="character-body" style="height: ${height}px;">
            ${charHtml}
            <div class="badge-number">${val}</div>
          </div>
        `;

        if (selectedIdx === idx) {
          node.classList.add('selected');
        }

        node.addEventListener('click', () => onNodeClick(idx));
        track.appendChild(node);
      });

      updateButtons();
      checkVictory();
    }

    // Bosganda tanlash
    function onNodeClick(idx) {
      if (isBusy) return;
      AudioEngine.playClick();

      if (selectedIdx === idx) {
        selectedIdx = null;
        statusText.textContent = "Tanlov bekor qilindi. O'zingiz xohlagan boshqa personajni tanlang.";
      } else {
        selectedIdx = idx;
        statusText.textContent = `Tanlandi: #${array[idx]} sonli personaj. Chapga yoki o'ngga sakrating!`;
      }
      renderTrack();
    }

    // Tugmalar holatini yangilash
    function updateButtons() {
      btnLeft.disabled = isBusy || selectedIdx === null || selectedIdx <= 0;
      btnRight.disabled = isBusy || selectedIdx === null || selectedIdx >= array.length - 1;
      btnStep.disabled = isBusy;
      btnAuto.disabled = isBusy;
      btnReset.disabled = isBusy;
    }

    // Kechikish funksiyasi
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    /* ==========================================================
       4. SILLIQ VA BALAND EGRI CHIZIQ (ARC) SAKRASH TRANSFORMATSIYASI
       ========================================================== */
    async function swapElements(i, j, sound = true) {
      if (i === j) return;
      if (i > j) { const temp = i; i = j; j = temp; } // doim i < j

      const nodeA = document.getElementById(`char-${i}`);
      const nodeB = document.getElementById(`char-${j}`);

      if (!nodeA || !nodeB) return;

      const total = array.length;
      const leftA = getNodeLeftPosition(i, total);
      const leftB = getNodeLeftPosition(j, total);

      // Tovush
      if (sound) AudioEngine.playJump(true);

      // Animatsiya sinflari
      nodeA.classList.add('jumping-right');
      nodeB.classList.add('jumping-left');

      // Silliq siljish
      nodeA.style.left = `${leftB}px`;
      nodeB.style.left = `${leftA}px`;

      await sleep(600);

      // Massivda almashtirish
      const tempVal = array[i];
      array[i] = array[j];
      array[j] = tempVal;

      nodeA.classList.remove('jumping-right');
      nodeB.classList.remove('jumping-left');

      if (selectedIdx === i) selectedIdx = j;
      else if (selectedIdx === j) selectedIdx = i;

      renderTrack();
    }

    // Qo'lda sakratish
    async function manualMove(direction) {
      if (selectedIdx === null || isBusy) return;
      const targetIdx = selectedIdx + direction;
      if (targetIdx < 0 || targetIdx >= array.length) return;

      isBusy = true;
      updateButtons();
      statusText.textContent = `${array[selectedIdx]} va ${array[targetIdx]} o'zaro sakrab joy almashmoqda...`;

      await swapElements(selectedIdx, targetIdx, true);

      isBusy = false;
      updateButtons();
    }

    /* ==========================================================
       5. BUBBLE SORT ALGORITMI (KOMPYUTER SARALASHI)
       ========================================================== */
    async function bubbleSortStep() {
      if (isBusy) return;
      isBusy = true;
      selectedIdx = null;
      updateButtons();

      let swappedAny = false;

      for (let i = 0; i < array.length - 1; i++) {
        // Taqqoslash
        statusText.textContent = `Taqqoslash: ${array[i]} va ${array[i+1]}`;
        const node1 = document.getElementById(`char-${i}`);
        const node2 = document.getElementById(`char-${i+1}`);
        if (node1) node1.classList.add('selected');
        if (node2) node2.classList.add('selected');

        await sleep(400);

        if (array[i] > array[i+1]) {
          statusText.textContent = `${array[i]} > ${array[i+1]}! Sakrab o'rni almashtirilmoqda!`;
          await swapElements(i, i+1, true);
          swappedAny = true;
          await sleep(250);
          break; // Bitta qadamda bitta almashinuv
        } else {
          if (node1) node1.classList.remove('selected');
          if (node2) node2.classList.remove('selected');
        }
      }

      if (!swappedAny) {
        statusText.textContent = "Algoritm tekshirdi: massiv allaqachon to'g'ri tartiblangan!";
      }

      isBusy = false;
      renderTrack();
    }

    async function autoBubbleSort() {
      if (isBusy) return;
      isBusy = true;
      selectedIdx = null;
      updateButtons();

      let n = array.length;
      let swapped;

      do {
        swapped = false;
        for (let j = 0; j < n - 1; j++) {
          statusText.textContent = `Bubble Sort: ${array[j]} va ${array[j+1]} taqqoslanmoqda...`;
          
          const node1 = document.getElementById(`char-${j}`);
          const node2 = document.getElementById(`char-${j+1}`);
          if (node1) node1.classList.add('selected');
          if (node2) node2.classList.add('selected');
          await sleep(350);

          if (array[j] > array[j+1]) {
            statusText.textContent = `${array[j]} kattaroq, o'ng tomonga sakrab o'tmoqda!`;
            await swapElements(j, j+1, true);
            swapped = true;
            await sleep(300);
          } else {
            if (node1) node1.classList.remove('selected');
            if (node2) node2.classList.remove('selected');
          }
        }
        n--;
      } while (swapped);

      isBusy = false;
      renderTrack();
    }

    // Qayta aralashtirish
    function resetAndShuffle() {
      if (isBusy) return;
      selectedIdx = null;
      // Aralashtirish
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      statusText.textContent = "Personajlar aralashtirildi! Endi ularni 1 dan 8 gacha saralang.";
      renderTrack();
    }

    /* ==========================================================
       6. G'ALABA VA KONFETTI EFFEKTI
       ========================================================== */
    function checkVictory() {
      const isSorted = array.every((val, idx) => idx === 0 || array[idx - 1] <= val);
      if (isSorted) {
        statusText.innerHTML = "🎉 <b>AJOYIB G'ALABA!</b> Barcha qahramonlar 1 dan 8 gacha to'g'ri tartiblandi! 🌟";
        document.querySelectorAll('.char-node').forEach(node => node.classList.add('victory'));
        AudioEngine.playVictory();
        launchConfetti();
      }
    }

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = Array.from({ length: 90 }, () => ({
        x: Math.random() * canvas.width,
        y: -20,
        r: Math.random() * 8 + 4,
        color: ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'][Math.floor(Math.random() * 5)],
        speed: Math.random() * 4 + 2,
        tilt: Math.random() * 10 - 5
      }));

      let frames = 0;
      function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.y += p.speed;
          p.x += Math.sin(frames * 0.05) + p.tilt * 0.2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        });
        frames++;
        if (frames < 180) {
          requestAnimationFrame(animateConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animateConfetti();
    }

    /* ==========================================================
       7. HODISALARNI ULASH
       ========================================================== */
    btnLeft.addEventListener('click', () => manualMove(-1));
    btnRight.addEventListener('click', () => manualMove(1));
    btnStep.addEventListener('click', bubbleSortStep);
    btnAuto.addEventListener('click', autoBubbleSort);
    btnReset.addEventListener('click', resetAndShuffle);

    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
    });

    window.addEventListener('resize', () => {
      renderTrack();
    });

    // Boshlang'ich yuklash
    applyTheme('penguin');
  </script>
</body>
</html>
