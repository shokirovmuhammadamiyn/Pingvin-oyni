<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Party Games 4 Player — Mini Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BOSH MENYU -->
  <div id="menuScreen" class="screen active">
    <div class="menu-box">
      <div class="menu-title">
        <h1>4 PLAYER PARTY</h1>
        <p>Do‘stlar bilan yoki Aqlli Botlarga qarshi!</p>
      </div>

      <div class="mode-select">
        <label>O‘yinchilar soni:</label>
        <div class="mode-btns">
          <button class="mode-btn active" data-players="1">1 O‘yinchi (vs 3 Bot)</button>
          <button class="mode-btn" data-players="2">2 O‘yinchi</button>
          <button class="mode-btn" data-players="4">4 O‘yinchi (Party)</button>
        </div>
      </div>

      <div class="game-cards">
        <div class="card card-fishing" onclick="launchGame('fishing')">
          <div class="card-icon">🎣</div>
          <h2>Baliq Ovi</h2>
          <p>Qarmoqni otib, eng ko‘p baliqlarni ilib oling!</p>
          <span class="play-badge">O‘ynash ▶</span>
        </div>

        <div class="card card-tank" onclick="launchGame('tank')">
          <div class="card-icon">🛡️</div>
          <h2>Tank Jangi</h2>
          <p>O‘q uzing, devorlardan foydalaning va yengib chiqing!</p>
          <span class="play-badge">O‘ynash ▶</span>
        </div>
      </div>
    </div>
  </div>

  <!-- O'YIN MAYDONI EKRANI -->
  <div id="gameScreen" class="screen">
    <!-- Yuqori panel -->
    <div class="top-nav">
      <button class="btn-icon" id="btnBack">🏠 Menyu</button>
      <div id="gameTimer" class="timer-badge">⏱️ 45</div>
      <button class="btn-icon" id="btnSound">🔊</button>
    </div>

    <!-- Canvas o'yin maydoni -->
    <div class="canvas-container">
      <canvas id="gameCanvas"></canvas>

      <!-- 4 BURCHAK TOUCH TUGMALARI (Smartfonlar uchun) -->
      <div class="corner-btn corner-p1" id="tapP1">
        <span class="btn-dot dot-cyan"></span>
        <span class="btn-txt">P1</span>
      </div>
      <div class="corner-btn corner-p2" id="tapP2">
        <span class="btn-dot dot-green"></span>
        <span class="btn-txt">P2</span>
      </div>
      <div class="corner-btn corner-p3" id="tapP3">
        <span class="btn-dot dot-purple"></span>
        <span class="btn-txt">P3</span>
      </div>
      <div class="corner-btn corner-p4" id="tapP4">
        <span class="btn-dot dot-black"></span>
        <span class="btn-txt">P4</span>
      </div>
    </div>
  </div>

  <!-- G'ALABA / NATIJA MODAL -->
  <div id="resultModal" class="modal">
    <div class="modal-card">
      <div class="modal-crown" id="resIcon">🏆</div>
      <h2 id="resTitle">G‘olib: 1-O‘yinchi!</h2>
      <div id="resScores" class="score-board"></div>
      <div class="modal-btns">
        <button class="btn-glow" id="btnRestart">🔄 Yana o‘ynash</button>
        <button class="btn-plain" id="btnMenu">🏠 Menyu</button>
      </div>
    </div>
  </div>

  <!-- SKRIPTLAR -->
  <script src="main.js"></script>
  <script src="fishing.js"></script>
  <script src="tank.js"></script>
</body>
</html>
